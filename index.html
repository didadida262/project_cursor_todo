<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Todo App</h1>
        </header>
        
        <main>
            <!-- Task Input Form -->
            <section class="input-section">
                <form id="todo-form" class="todo-form">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="todo-input" 
                            placeholder="Enter a new todo item..." 
                            required
                            maxlength="100"
                        >
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </section>

            <!-- Filter and Statistics -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <div class="stats">
                    <span id="task-count">0 tasks</span>
                </div>
            </section>

            <!-- Todo List -->
            <section class="todo-section">
                <ul id="todo-list" class="todo-list">
                    <!-- Todo items will be dynamically added via JavaScript -->
                </ul>
                <div id="empty-state" class="empty-state">
                    <p>No todos yet. Add one to get started!</p>
                </div>
            </section>

            <!-- Batch Actions -->
            <section class="batch-actions">
                <button id="clear-completed" class="btn btn-secondary">Clear Completed</button>
                <button id="clear-all" class="btn btn-danger">Clear All</button>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
